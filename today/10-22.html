<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>10월 22일</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+And+White+Picture&display=swap');
        .title{
            height:515px;
            width:800px;
            background:url('img/pig.jpg') no-repeat left top;
            background-size:cover;
        }
        .ttop{
            background-color:rgba(88, 86, 86, 0.479);
        }
        h1 p{
            margin:5px 0;
        }
        
        form.main{
            width:800px;
            text-align:center;
            border:1px solid #ccc;
            line-height:2;
        }
        .name{
            margin-top:1px;
            background-color:rgb(0,0,0);
            font-size:20px;
            text-align:left;
            color:black;
            overflow:hidden;
        }
        .name:hover{
            color:white;
            overflow:visible;
            font-family: 'Black And White Picture', serif;
        }
        form.main h2.color{
            font-size:20px;
            color:red;
        }
        span{
            color:blue;
        }
        .main{
            font-size:25px;
        }
    </style>
</head>
<body>
    <form class="main">
        <div class="title">
            <br><br><br><br><br>
            <div class="ttop">
                <h1 style="text-indent:15px;">돼지 국밥</h1>
                <p style="color:yellow">돼지고기가 많고 맛도 있지만 영양도 많습니다<br>
                질좋은 돼지를 저렴하게 즐겨보세요</p>
            </div>
        </div>
        <div>
            <h2 class="name">확인하세요</h2>
            <h2 class="color">주문 및 배송</h2>
            <p><span>오후 2시 이전</span> 주문건은 당일 발송합니다<br>
            2시 이후 주문건은 다음날 발송합니다(주말 제외)</p>
            <hr>
            <h2 class="color">교환 및 환불</h2>
            <p>불만즉시 <span>100% 환불</span>해 드립니다<br>
            고객센터로 전화주세요</p>
            <hr>
            <h2 class="color">고객센터</h2>
            <p>0000-0000</p>
            <p>상담시간 : 오전9시 ~ 오후 6시(토/일, 공휴일 휴무)</p>
        </div>
    </form>
</body>
</html>
