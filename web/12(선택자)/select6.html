<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        ul{
            list-style:none;
        }
        li{
            display:inline-block;
            margin:10px;
        }
        li a{
            padding: 5px 20px;
            font-size: 14px;
            color: blue;
            text-decoration:none;
        }
        /* [속성|=값] 선택자 */
        a[title |="us"]{
            background: url(img/vips.jpg) no-repeat left center;
            padding:5px 25px;
        }
        a[title |="us"]{
            background: url(img/banner.jpg) no-repeat left center;
            padding:5px 25px;
        }

    </style>
</head>
<body>
    <ul>
        <li>외국어 서비스 :</li>
        <li><a href="#" title="us">영어</a></li>
        <li><a href="#" title="us-english">영어</a></li>
        <li><a href="#" title="japanese">일본어</a></li>
    </ul>
</body>
</html>
