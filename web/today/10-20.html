<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <title>10월 20일</title>
    <style>
        ul{
            list-style:none;
        }
        li{
            margin:20px;
        }
        li label{
            width:80px;
            float:left;
        }
        img{
            height:150px;
            width:100%;
        }
    </style>
</head>
<body>
    <figure>
        <a href="https://www.weather.go.kr/w/index.do">
            <img src="3(image)/img/ocean.jpg" alt="휴식">
        </a>
        <figcaption>
            멋진 바다집 이미지 입니다.
        </figcaption>
    </figure>
    <p>* 당신의 완벽한 휴식을 위한 프리미엄 객실을 예약하세요.</p>
    <form>
        <fieldset>
            <legend>예약자 기본 정보</legend>
            <ul>
                <li>
                    <label for="user_name">예약자명</label>
                    <input type="text" id="user_name">
                </li>
                <li>    
                    <label for="phone">연락처</label>
                    <input type="tel" id="phone">
                </li>    
                <li>
                    <label for="mail">이메일</label>
                    <input type="email" id="mail">
                </li>    
            </ul>
        </fieldset>
        <fieldset>
            <legend>예약 상세 정보</legend>
            <ul>
                <li>
                    <label for="day">체크인 날짜</label>
                    <input type="date" id="day">
                </li>
                <li>
                    <label for="check">객실 선택</label>
                    <input type="search" id="check">
                </li>
                <li>
                    <label for="ran">숙박 인원(최대 4인)</label>
                    <input type="text" id="ran">
                </li>
            </ul>
        </fieldset>
        <input type="submit" value="예약하기">
        <input type="" value="다시쓰기">
    </form>
</body>
</html>
