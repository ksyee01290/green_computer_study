<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        div{
            width:400px;
            height:200px;
            padding: 35px;
            border:15px solid #ccc;
            margin-bottom:20px;
        }
        .bg1{
            background:url('img/puu.png') no-repeat;
            background-origin:padding-box;
        }
        .bg2{
            background:url('img/puu.png') no-repeat;
            background-origin:border-box;
        }
        .bg3{
            background:url('img/puu.png') no-repeat;
            background-origin:content-box;
        }
    </style>
</head>
<body>
    <div class="bg1"></div>
    <div class="bg2"></div>
    <div class="bg3"></div>

</body>
</html>
