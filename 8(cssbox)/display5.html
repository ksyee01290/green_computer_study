<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            height:200px;
            margin:20px;
            display: inline-block;
        }
        .round{
            border:2px dotted red;
            border-radius:20px;
        }
        #bg{
            border:3px solid green;
            border-radius:120px/40px;
            background:url(img/hosu.jpg) no-repeat;
            background-size:cover;
        }
        nav{
            width:100%;
            height:60px;
            background-color:#069;
        }
        nav ul{
            list-style-type:none;
        }
        nav ul li{
            display: inline-block;
            margin:20px;
        }
        nav ul li a{
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">애완견 종류</a></li>
            <li><a href="#">입양하기</a></li>
            <li><a href="#">건강돌보기</a></li>
            <li><a href="#">더불어살기</a></li>
        </ul>
    </nav>
    <div class="round"></div>
    <div class="round" id="bg"></div>
</body>
</html>
