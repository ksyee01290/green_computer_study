<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        div{
            width:200px;
            height:100px;
            display:inline-block;
            margin:15px;
            border-width:5px;
        }
        .box1{
            border-style:solid;
            border-color:red;
        }
        .box2{
            border-style:dotted;
            border-color:blue;
        }
        .box3{
            border-style:dashed;
            border-width:5px 10px 15px 20px;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
