<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        ul{
            list-style:none;
        }
        li{
            padding: 5px 30px;
        }
        li a {
            font-size: 16px;
            color: blue;
            text-decoration:none;
        }
        /* 속성 = 값 선택자 */
        a[target="_blank"]{
            padding-right:30px;
            background:url('img/vips') no-repeat center right;
        }
    </style>
</head>
<body>
    <h1>html5 표준안 사이트</h1>
    <ul>
        <li><a href="https://www.naver.com/" target="_blank">html</a></li>
        <li><a href="https://www.naver.com/">css selector level 3</a></li>
        <li><a href="https://www.naver.com/">미디어 쿼리</a></li>
    </ul>
</body>
</html>
