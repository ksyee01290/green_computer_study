<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        function open_win(){
            var width = 300;
            var height = 200;
            var left = screen.width / 2 - width / 2;
            var top = screen.height / 2 - height / 2;
            var mywin = window.open('http://www.naver.com', 'popup', 'top='+top+',left='
            +left+',width='+width+',height='+height+',scrollbars=yes');                
        }
        var addNum =0;
        var subNum =1000;

        var auto_1 = setInterval(function(){
            addNum++;
            console.log("addNum: " + addNum);
        }, 1000);
        var auto_2 = setInterval(function(){
            subNum--;
            console.log("subNum: " + subNum);
        }, 1000);

    </script>
    <title>Document</title>
</head>
<body>
    <input type="button" balue="네이버 사이트새창으로 띄우기" onClick="open_win()"/>

    <h1>일정 시간 간격으로 값 증감시키기</h1>
    <p> 콘솔 패널을 열어 확인하세요</p>
    <button onclick="clearInterval(auto_1)">증가 정지</button>
    <button onclick="clearInterval(auto_2)">감소 정지</button>
</body>
</html>
