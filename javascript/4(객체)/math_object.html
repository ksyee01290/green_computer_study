<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        document.write("<h1>컴퓨터 가위, 바위, 보 맞추기</h1>");
        var game = prompt("가위, 바위, 보 중 선택하세요?", "가위");
        var gameNum;
        switch(game){
            case "가위": gameNum = 1;
            break;
            case "바위": gameNum = 2;
            break
            case "보": gameNum = 3;
            break
            default: alert("잘못 작성하셧습니다.");
            location.reload();
        }
        var com = Math.ceil(Math.random()*3);
        if(com == 1){
            document.write("<h1>가위</h1>");
            document.write("<img src=\"img/si.jpg\">");
        }else if(com == 2){
            document.write("<h1>바위</h1>");
            document.write("<img src=\"img/ro.jpg\">");
        }else{
            document.write("<h1>보</h1>");
            document.write("<img src=\"img/bo.jpg\">");
        }

        if(gameNum == com){
            document.write("<h1>비겼습니다.</h1>");
        }else if((gameNum==1&&com==3) || (gameNum==2&&com==1) || (gameNum==3&&com==2)){
            document.write("<h1>이겼습니다.</h1>");
        }else{
            document.write("<h1>졌습니다.</h1>")
        }

        var i = 6
        while(i>0){
            var com = Math.ceil(Math.random()*45);
            document.write(com+", ");   
            i--; 
        }
        

    </script>
    <title>Document</title>
</head>
<body>
    
</body>
</html>
