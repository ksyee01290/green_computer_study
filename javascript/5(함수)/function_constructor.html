<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        function ranData(){
            var date = new Date();
            var x = date.getSeconds();
            var y = (x%5) + 1;
            alert("난수 = "+y);
        }
    </script>
    <title>Document</title>
</head>
<body>
    <a href="#" onclick="ranData()">난수 발생기</a>
</body>
</html>
