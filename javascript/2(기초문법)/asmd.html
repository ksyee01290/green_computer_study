<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        // 문자열 결합
        var t1 = "학교종이";
        var t2 = "땡땡땡";
        var t3 = 8282;
        var t4 = "어서 모이자";
        var result = t1+t2+t3+t4;
        document.write(result+"<br>");
        // 사칙연산
        var num1 = 3;
        var num2 = 10;
        num1 += num2;
        document.write(num1+"<br>");
        num1 -= num2;
        document.write(num1+"<br>");
        num1 *= num2;
        document.write(num1+"<br>");
        num1 /= num2;
        document.write(num1+"<br>");
        num1 %= num2;
        document.write(num1+"<br>");
    </script>
    <title>Document</title>
</head>

</body>
</html>
