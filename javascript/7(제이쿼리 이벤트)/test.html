<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(function(){
            $("header, section, footer,article").css("border","1px solid black")
            .css("padding","5px").css("margin","0 5px");
        });
        $(function(){
            $("header, footer").css("height","80px");
        });
        $(function(){
            $(".im").css("margin","0px").css("padding","0px").css("display","flex");
        });
        $(function(){
            $(".im div").css("border","1px solid black");
        });
        $(function addimage(){
            $(".p-2").html("<img src='img/pic_1.jpg'>");
        });

        $(function(){
            $(".food1").on({
                "mouseover focus": function(){
                    $(".txt1").css({"display":"block"});
                },
                "mouseout blur": function(){
                    $(".txt1").css({"display":"none"});
                }
            });
        });

        
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body>
    <header class="mw-100 text-center">
        <h1>헤더</h1>
    </header>
    <section>
        <article class="p-3 m-0 border-0 bd-example m-0 border-0">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/pic_2.jpg" class="d-block w-50" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="img/pic_4.jpg" class="d-block w-50" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="img/pic_6.jpg" class="d-block w-50" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </article>
        <article class="im">
            <div class="food1 position-relative">
                <img src="img/pic_2.jpg" class="d-block w-100 h-100 object-fit-cover">
                <p class="txt1 position-absolute bottom-0 start-0 w-100
                text-center bg-dark bg-opacity-75 p-3 m-0">
                <a href="#" class="text-white text-decoration-none fs-5">맛있는 음식</a></p>
            </div>
            <div class="food2 position-relative">
                <img src="img/pic_4.jpg" class="d-block w-100 h-100 object-fit-cover">
            </div>
            <div class="food2 position-relative">
                <img src="img/pic_6.jpg" class="d-block w-100 h-100 object-fit-cover">
            </div>
        </article>
    </section>
    <footer class="text-center">
        <h1>푸터</h1>
    </footer>
</body>
</html>
