<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        //반복문
        //while
        var i = 20;
        while(i>=10){
            if(i%2==0){
                document.write("<p class='blue'>" +i+"</p>");
            }else{
                document.write("<p class='red'>" +i+"</p>");
            }
            i--;
        }
        //do while
        var i=10;
        do{
            document.write("hello");
        } while (i < 3)

        // for
        var num = 0;
        for(var i=1;i<=9;i++){
            for(var j=1;j<=9;j++){
                num=i*j;
                document.write(i+"*"+j+"="+num,"<br>");
            }
            document.write("<br>");
        }
        // for break
        for(var i=1;i<=10;i++){
            if(i==6) break;
            document.write(i,"<br>");
        }
        document.write("=== the end ===");

        //for continue
        for(var i=1;i<=10;i++){
            if(i%2==0) continue;
            document.write(i, "<br>");
        }
        document.write("=== the end ===");
    </script>
    <title>Document</title>
    <style>
        *{margin: 0;}
        .blue{color:#00f;}
        .red{color:#f00;}
    </style>
</head>
<body>
    
</body>
</html>
