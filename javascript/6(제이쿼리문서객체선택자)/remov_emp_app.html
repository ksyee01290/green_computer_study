<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        //remove 는 class 자체를지우는 용도
        // clone는 원하는 class를 복사하는 용도
        //empty는 원하는 박스는 냅두고 내용물을 지우는 용도
        //append는 원하는박스에 내용물을 추가하는 용도 내용물이 들어있다면
        //추가로 집어넣는다
        $(function(){
            var copyObj = $(".box1").children().clone();
            $(".box2").remove();

            $(".box3").empty();
            $(".box3").append(copyObj);
        });
    </script>
    <title>Document</title>
</head>
<body>
    <div class="box1">
        <p>내용1</p>
        <p>내용2</p>
    </div>
    <div class="box2">
        <p>내용3</p>
        <p>내용4</p>
    </div>
    <div class="box3">
        <p>내용5</p>
        <p>내용6</p>
    </div>
</body>
</html>
