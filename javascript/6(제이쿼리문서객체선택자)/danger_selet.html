<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(function(){
            $(".wrap_1 p:first")
            .text("내용1");

            $(".wrap_1 p.active")
            .removeClass("active")
            .addClass("on");

            $(".wrap_1 p:eq(2) a")
            .attr("href","http://www.naver.com");
            $(".wrap_1 p:eq(3) input").val("korea");

            $(".wrap_2 p:first").after("<p>After(추가1)</p>");
            $(".wrap_2 p:first").before("<p>After(추가2)</p>");

            $(".wrap_3 p")
            .unwrap()
            .wrapInner("<strong/>");
        });
    </script>
    <title>Document</title>
</head>
<body>
    <div class="wrap_1">
        <p>텍스트1</p>
        <p class="active">내용2</p>
        <p><a href="#">네이버</a></p>
        <p><input type="text" value="hello"></p>
    </div>
    <div class="wrap_2">
        <p>내용5</p>
        <p>내용6</p>
    </div>
    <div class="wrap_3">
        <div> 
            <p>내용7</p>
            <p>내용8</p>
        </div>
</body>
</html>
